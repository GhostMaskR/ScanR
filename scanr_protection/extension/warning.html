<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScanR Warning</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#140a0c;color:#f2e9e9;font-family:system-ui,Segoe UI,sans-serif}
  .box{max-width:620px;width:92%;border:1px solid #7a1f2b;border-radius:12px;padding:28px;background:#1d0e11}
  h1{margin:0 0 6px;font-size:24px;color:#ff5a6e}
  .tag{display:inline-block;padding:2px 10px;border-radius:99px;background:#7a1f2b;font-size:12px;text-transform:uppercase}
  code{display:block;margin:14px 0;padding:10px;background:#0d0607;border-radius:8px;word-break:break-all;font-size:13px;color:#ffb3bd}
  p{line-height:1.5;color:#d9c9cb}
  .row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
  button{font-size:15px;border-radius:8px;cursor:pointer;border:0;padding:12px 20px}
  #back{background:#2fa56b;color:#fff;font-weight:600}
  #go{background:transparent;color:#8d7a7c;border:1px solid #4a3a3c;font-size:13px}
  small{color:#8d7a7c}
</style>
</head>
<body>
  <div class="box">
    <h1>Warning: risky website</h1>
    <span class="tag" id="verdict">-</span>
    <code id="url"></code>
    <p id="detail"></p>
    <p>This site may steal passwords or install malware. A scan with no detections never proves a site is safe,
       and a detection can occasionally be a false positive.</p>
    <div class="row">
      <button id="back" autofocus>Go back to safety</button>
      <button id="go">Continue anyway (at my own risk)</button>
    </div>
    <small>ScanR URL Protection</small>
  </div>
  <script src="warning.js"></script>
</body>
</html>
