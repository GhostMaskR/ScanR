const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  <div class="tabs">${['Detection','Details','Relations','Behavior','Community'].map((t,i)=>`<button data-t="${t.toLowerCase()}" class="${i?'':'on'}">${t.toUpperCase()}</button>`).join('')}</div><div id="tp"></div>`;
