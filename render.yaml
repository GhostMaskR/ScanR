services:
  - type: web
    name: scanr-central-gateway
    runtime: python
    plan: free
    rootDir: central_backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 45 central_gateway:app
    healthCheckPath: /health
    envVars:
      - key: VT_API_KEY
        sync: false
