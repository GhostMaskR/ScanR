#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.w{position:relative;z-index:1}

@keyframes sh{to{background-position:-200% 0}}@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes fl{50%{transform:translateY(-8px)}}@keyframes bc{50%{border-color:var(--ac)}}
.hero h1{animation:fu .6s both}.hero p{animation:fu .6s .1s both}.fi{font-size:48px;display:block;animation:fl 3s ease-in-out infinite}

.lt{font-weight:600}.pbar{height:3px;max-width:260px;margin:14px auto 0;background:var(--bd);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;width:40%;background:var(--ac);border-radius:3px;animation:ib 1.1s ease-in-out infinite}@keyframes ib{from{margin-left:-40%}to{margin-left:100%}}

#cw{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 36px));height:min(480px,65vh);background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.35);z-index:15;opacity:0;transform:translateY(20px) scale(.96);pointer-events:none;transition:.25s;overflow:hidden}#cw.on{opacity:1;transform:none;pointer-events:auto}
.ch{display:flex;justify-content:space-between;padding:12px 14px;background:linear-gradient(135deg,var(--ac),#a23bff);color:#fff}.ch span{cursor:pointer}
#cm{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bb{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13.5px;animation:fu .3s both;word-break:break-word}.bb.b{background:var(--ban);align-self:flex-start;border-bottom-left-radius:3px}.bb.u{background:var(--ac);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.ty i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:dt 1s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}@keyframes dt{50%{transform:translateY(-5px);opacity:.4}}
.cq{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}.cq span{font-size:12px;padding:4px 10px;border:1px solid var(--ac);color:var(--ac);border-radius:999px;cursor:pointer;transition:.2s}.cq span:hover{background:var(--ac);color:#fff}
.ci{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}.ci input{flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);outline:0}.ci .btn{margin:0;padding:8px 14px}

<body>
<canvas id="bg"></canvas><div class="w">
<div class="hd"><div class="logo" id="lg">scan<b>R</b></div><input id="q" placeholder="Search a SHA-256 / SHA-1 / MD5 hash or a URL" autocomplete="off"><label class="ib" title="Upload file">⬆<input type="file" id="fi" hidden></label><button class="ib" id="tg" title="Theme">◐</button></div>
<div id="m"></div>
</div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),M=$('#m');let cur=null;
const DEMO={attributes:{meaningful_name:'frm_download_file (12).pdf',names:['frm_download_file (12).pdf'],size:486462,type_description:'PDF',type_tags:['document','pdf'],tags:['pdf','calls-wmi'],md5:'9afee3cf5c5794df6d43f38aea154f23',sha1:'869ee840c7d4f50f25f5d87f1622e6fb724fdd83',sha256:'bc143c4beac1ae504cdb9dbc47732924beee3f6bd9e5a62d40c4c7845d3fe68e',vhash:'9b062b83560b431a4db6ac029d38c2ca6',ssdeep:'12288:gpuumw9We+mzEiHQbQUj0G+Ho4x7GsAyBrv:AWK7UgbB7Yo',tlsh:'T144A4E072F89EAC8CECC68B8D46627495462DB136E2CD3481217C4B10E286FE5E7973D7',magic:'PDF document, version 1.5, 7 pages',trid:[{file_type:'Adobe Portable Document Format',probability:100}],magika:'PDF',first_submission_date:1747055091,last_submission_date:1747055091,last_analysis_date:1747055091,last_analysis_stats:{malicious:0,suspicious:0,undetected:44,harmless:0,'type-unsupported':6},last_analysis_results:Object.fromEntries('Acronis,AhnLab-V3,ALYac,Antiy-AVL,Arcabit,Avast,AVG,Avira,Baidu,BitDefender,Bkav,ClamAV,CrowdStrike Falcon,Cylance,Cynet,DrWeb,Elastic,ESET-NOD32,Fortinet,GData,Google,Gridinsoft,Ikarus,Kaspersky,Lionic,Malwarebytes,McAfee,Microsoft,NANO-Antivirus,Panda,QuickHeal,Sangfor,SentinelOne,Sophos,Symantec,Tencent,TrendMicro,VBA32,VIPRE,ViRobot,WithSecure,Xcitium,Zillya,ZoneAlarm'.split(',').map(n=>[n,{category:'undetected',result:null}]).concat('Alibaba,Avast-Mobile,DeepInstinct,Trapmine,Webroot,Palo Alto Networks'.split(',').map(n=>[n,{category:'type-unsupported',result:null}])))}};
const dt=e=>e?new Date(e*1000).toISOString().replace('T',' ').slice(0,19)+' UTC':'—';
const ago=e=>{if(!e)return'—';const d=(Date.now()/1000-e)/86400;return d>=365?Math.floor(d/365)+' year'+(d>=730?'s':'')+' ago':d>=30?Math.floor(d/30)+' months ago':d>=1?Math.floor(d)+' days ago':'today'};
const fs=n=>n>1048576?(n/1048576).toFixed(2)+' MB':(n/1024).toFixed(2)+' KB';
async function api(p,o){let r;try{r=await fetch(p,o)}catch(e){throw{net:1}}const ct=r.headers.get('content-type')||'';if(!ct.includes('json'))throw{net:1};if(!r.ok)throw{status:r.status};return r.json()}
const load=t=>M.innerHTML=`<div class="hero"><div class="radar"><i></i></div><div class="lt">${t}</div><div class="pbar"><i></i></div></div>`;
function home(){cur=null;M.innerHTML=`<div class="hero"><h1>Analyze suspicious files and URLs</h1><p>Search a hash, paste a URL or drop a file. Multi-engine verdicts via your own backend.</p><div class="drop" id="dz">Drop a file or tap to choose<br><small>Hashed in your browser first. Uploaded only if unknown.</small></div></div>`;wire()}
function wire(){const d=$('#dz');if(!d)return;d.onclick=()=>$('#fi').click();d.ondragover=e=>{e.preventDefault();d.classList.add('o')};d.ondragleave=()=>d.classList.remove('o');d.ondrop=e=>{e.preventDefault();e.dataTransfer.files[0]&&file(e.dataTransfer.files[0])}}
$('#lg').onclick=home;$('#tg').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()==='#10122a';r.dataset.theme=dk?'light':'dark'};
$('#q').onkeydown=e=>{if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v)return;/^[a-f0-9]{32}$|^[a-f0-9]{40}$|^[a-f0-9]{64}$/i.test(v)?byHash(v.toLowerCase()):byUrl(v)};
$('#fi').onchange=e=>e.target.files[0]&&file(e.target.files[0]);

function scanToVT(j, kind, id) {
  const r = (j && j.result) || {};
  const stats = r.last_analysis_stats || {
    malicious: Number(r.malicious || 0),
    suspicious: Number(r.suspicious || 0),
    harmless: Number(r.harmless || 0),
    undetected: Number(r.undetected || 0)
  };

  const results =
    r.last_analysis_results &&
    typeof r.last_analysis_results === 'object'
      ? r.last_analysis_results
      : {};

  const attributes = {
    ...r,
    url: r.url || (kind === 'url' ? id : null),
    meaningful_name: r.meaningful_name || null,
    names: Array.isArray(r.names) ? r.names : [],
    type_description:
      r.type_description || (kind === 'url' ? 'URL' : r.resource_type || 'File'),
    last_analysis_stats: stats,
    last_analysis_results: results,
    last_analysis_date: r.analysis_date || r.last_analysis_date || null,
    total_votes: r.total_votes || {
      harmless: 0,
      malicious: 0
    }
  };

  return {
    data: {
      id: id || r.url || r.sha256 || 'unknown',
      type: kind === 'url' ? 'url' : 'file',
      attributes
    }
  };
}


async function byHash(h, quiet) {
  if (!quiet) load('Looking up hash?');
  try {
    const j = await api('/api/scan/hash', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hash: h})
    });
    const d = scanToVT(j, 'file', h);
    show(d.data, 'file', h, 0);
    if (d.data.attributes.scanr_message) {
      M.insertAdjacentHTML('afterbegin',
        `<div class="note">${E(d.data.attributes.scanr_message)}</div>`);
    }
  } catch (e) {
    M.innerHTML = `<div class="note">${E(em(e.status || 0))}</div>`;
  }
}


async function file(f) {
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) {
    M.innerHTML = '<div class="note">File exceeds ScanR?s 10 MB limit.</div>';
    return;
  }
  load('Uploading file for VirusTotal analysis?');
  const fd = new FormData();
  fd.append('file', f, f.name);
  try {
    const j = await api('/api/scan/file', {method: 'POST', body: fd});
    const id = (j.result && (j.result.sha256 || j.result.hash)) || f.name;
    const d = scanToVT(j, 'file', id);
    d.data.attributes.meaningful_name = f.name;
    d.data.attributes.size = f.size;
    show(d.data, 'file', id, 0);
    if (d.data.attributes.scanr_message) {
      M.insertAdjacentHTML('afterbegin',
        `<div class="note">${E(d.data.attributes.scanr_message)}</div>`);
    }
  } catch (e) {
    M.innerHTML = `<div class="note">${E(em(e.status || 0))}</div>`;
  }
}

function miss(h,f){M.innerHTML=`<div class="hero"><h1>No results for this hash</h1><p class="kv">${E(h)}</p>${f||(cur&&cur.f)?'<button class="btn" id="ul">Upload for analysis</button>':'<p>Drop the file to upload it.</p>'}</div>`;const b=$('#ul');if(b)b.onclick=async()=>{if(!await consent())return;load('Uploading…');const fd=new FormData();fd.append('file',(f||cur.f));try{await api('/api/upload',{method:'POST',body:fd});for(let i=0;i<12;i++){load('Analyzing… ('+(i+1)+'/12)');await sleep(6000);try{const d=await api('/api/file/'+h);if(d.data.attributes.last_analysis_results&&Object.keys(d.data.attributes.last_analysis_results).length)return show(d.data,'file',h,0)}catch(e){}}M.innerHTML='<div class="note">Still analyzing. Search the hash again in a minute.</div>'}catch(e){M.innerHTML='<div class="note">'+em(e.status||0)+'</div>'}}}

async function byUrl(u) {
  u = String(u || '').trim();
  if (!u) return;
  load('Scanning URL?');
  try {
    const j = await api('/api/scan/url', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: u})

    : '<p>JavaScript global-variable data not available in API response.</p>';

  const context = a.crowdsourced_context
    ? json(a.crowdsourced_context)
    : '<p>No crowdsourced context returned by the API.</p>';

    section('Categories', categories) +
    section('Targeted Brands', brands) +
    section('History', history) +
    section('Redirection Chain', redirects) +
    section('HTTP Response', http + headers) +
    section('HTML Info', htmlInfo) +
    section('Network Requests / HTTPS Transactions', networks) +
    section('External Outbound Links', outbound) +

(function () {
  if (window.__scanRKeyboardFixInstalled) return;
  window.__scanRKeyboardFixInstalled = true;

  function getField(target) {
    if (!target || !target.matches) return null;
    return target.matches("#q, #hui, #hsi") ? target : null;
  }

  function insertText(el, text) {
    if (!el || !text) return;
    const start = el.selectionStart ?? el.value.length;
    const end = el.selectionEnd ?? start;

    el.value = el.value.slice(0, start) + text + el.value.slice(end);
    const pos = start + text.length;
    try { el.setSelectionRange(pos, pos); } catch (_) {}

    el.dispatchEvent(new Event("input", { bubbles: true }));
  }

  function onKeyDown(e) {
    const el = getField(e.target);
    if (!el || el.disabled || el.readOnly) return;

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v") {
      return; // Let the browser generate the paste event.
    }

    if (e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === "Backspace" || e.key === "Delete") {
      e.preventDefault();
      const start = el.selectionStart ?? el.value.length;
      const end = el.selectionEnd ?? start;
      let a = start, b = end;

      if (a === b && e.key === "Backspace") a = Math.max(0, a - 1);
      if (a === b && e.key === "Delete") b = Math.min(el.value.length, b + 1);

      el.value = el.value.slice(0, a) + el.value.slice(b);
      try { el.setSelectionRange(a, a); } catch (_) {}
      el.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }

    if (e.key.length === 1) {
      e.preventDefault();
      insertText(el, e.key);
    }
  }

    const el = getField(e.target);
    if (!el || el.disabled || el.readOnly) return;

    const previous = select.value;

    $("#sr-resource", panel).textContent = r
      ? (r.kind === "url" ? "URL: " : "File hash: ") + r.id
      : "Current URL/hash not detected";

    const options = r?.kind === "url" ? URL_RELATIONS : FILE_RELATIONS;
    select.innerHTML = options.map(([v, label]) =>
      `<option value="${esc(v)}">${esc(label)}</option>`
    ).join("");

    if (options.some(([v]) => v === previous)) select.value = previous;
  }

  function recordsFrom(payload) {
    return Array.isArray(payload?.result?.data) ? payload.result.data : [];
  }

  function renderRecords(records) {
    const target = $("#sr-results");
    $("#sr-count").textContent = `${records.length} record(s) returned by VirusTotal`;

    if (!records.length) {
      target.innerHTML =
        '<div style="padding:14px;border:1px solid #303b60;border-radius:7px;background:#171d38">Request succeeded, but no records were returned for this relationship.</div>';
      return;
    }

    target.innerHTML = records.map((item, i) => {
      const a = item?.attributes || {};
      const id = item?.id || "";
      const type = item?.type || "record";
      const title = a.meaningful_name || a.name || a.url ||
        a.ip_address || id || "(unnamed record)";

      const fields = [
        ["Type", type],
        ["ID", id],
        ["URL", a.url],
        ["IP address", a.ip_address],
        ["Meaningful name", a.meaningful_name],
        ["Reputation", a.reputation],
        ["Size", a.size]
      ].filter(([,v]) => v !== undefined && v !== null && v !== "");

      return `<article style="padding:12px;border:1px solid #303b60;border-radius:7px;background:#171d38">
        <div style="font-weight:600;margin-bottom:7px">${i + 1}. ${esc(title)}</div>
        <div style="display:grid;gap:5px;font-size:12px">
          ${fields.map(([k,v]) => `<div><span style="opacity:.7">${esc(k)}:</span> ${esc(v)}</div>`).join("")}
        </div>
      </article>`;
    }).join("");
  }

  async function loadRelations() {
    const panel = $("#scanr-live-relations");
    if (!panel) return;

    const resource = detectResource();
    const message = $("#sr-message");
    const results = $("#sr-results");
    const count = $("#sr-count");
    const button = $("#sr-refresh");
    const relation = $("#sr-relation").value;

    if (!resource) {
      message.textContent =
        "Current scan identify nahi hua. URL/hash scan dobara run karo, phir Relations tab kholo.";
      results.innerHTML = "";
      count.textContent = "";
      return;
    }

    if (resource.kind === "url" &&
        FILE_RELATIONS.some(([v]) => v === relation) &&
        !URL_RELATIONS.some(([v]) => v === relation)) {
      message.textContent = "Ye relationship URL resource ke liye available options mein nahi hai.";
      return;
    }

    button.disabled = true;
    button.textContent = "Loading...";
    message.textContent = "Fetching live VirusTotal relationship...";
    results.innerHTML = "";
    count.textContent = "";

    try {
      const response = await fetch("/api/relations", {
        method: "POST",
        headers: {"Content-Type":"application/json", "Accept":"application/json"},
        body: JSON.stringify({kind:resource.kind, id:resource.id, relation})
      });

      const payload = await response.json().catch(() => ({}));

      if (!response.ok || payload.success !== true) {
        const status = payload.upstream_status || response.status;
        const detail = payload.error || `HTTP ${response.status}`;

        if (status === 403) {
          message.textContent =
            "VirusTotal ne is relationship request ko authorize nahi kiya (403). API key configured hona endpoint access ki guarantee nahi hai.";
        } else if (status === 404) {
          message.textContent =
            "Is resource ke liye ye relationship VirusTotal par available nahi hai (404).";
        } else if (status === 429) {
          message.textContent =
            "VirusTotal rate limit reached (429). Thodi der baad retry karo.";
        } else {
          message.textContent = `VirusTotal/API error (${status}): ${detail}`;
        }

        count.textContent = "No synthetic data displayed.";
        return;
      }

      const records = recordsFrom(payload);
      message.textContent = records.length
        ? "Live VirusTotal request successful."
        : "Request successful; no records available for this relationship.";
      renderRecords(records);
    } catch (err) {
      message.textContent = "Backend connection error: " + (err?.message || err);
    } finally {
      button.disabled = false;
      button.textContent = "Load Relations";
    }
  }

  function install() {
    if ($("#scanr-live-relations")) {
      updateResource();
      return;
    }
    ensurePanel();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", install, {once:true});
  } else {
    install();
  }

  const observer = new MutationObserver(() => {
    if (!$("#scanr-live-relations")) install();
  });
  observer.observe(document.documentElement, {childList:true, subtree:true});

  window.addEventListener("hashchange", updateResource);
})();
</script>
<script>
/* SCANR_TYPING_FALLBACK: types, copies and pastes even if native input is blocked */
(function () {
  'use strict';
  if (window.__scanrTypeFallback) return;
  window.__scanrTypeFallback = true;

  var broken = false, warned = false, pasteSeen = false;
  var OK = /^(text|search|url|tel|password)$/i;

  function field(el) {
    if (!el || !el.tagName) return null;
    if (el.tagName === 'TEXTAREA') return el;
    if (el.tagName === 'INPUT' && OK.test(el.getAttribute('type') || 'text')) return el;
    return null;
  }
  function sel(el) {
    var s = null, e = null;
    try { s = el.selectionStart; e = el.selectionEnd; } catch (_) {}
    if (s == null || e == null) { s = e = el.value.length; }
    return [s, e];
  }
  function fire(el) { el.dispatchEvent(new Event('input', { bubbles: true })); }
  function put(el, text) {
    var r = sel(el), s = r[0], e = r[1];
    var mx = el.maxLength > 0 ? el.maxLength : 0;
    if (mx) text = text.slice(0, Math.max(0, mx - (el.value.length - (e - s))));
    if (!text) return;
    el.value = el.value.slice(0, s) + text + el.value.slice(e);
    try { el.setSelectionRange(s + text.length, s + text.length); } catch (_) {}
    fire(el);
  }
  function del(el, back) {
    var r = sel(el), s = r[0], e = r[1];
    if (s === e) {
      if (back) s = Math.max(0, s - 1); else e = Math.min(el.value.length, e + 1);
    }
    if (s === e) return;
    el.value = el.value.slice(0, s) + el.value.slice(e);
    try { el.setSelectionRange(s, s); } catch (_) {}
    fire(el);
  }
  function flag() {
    broken = true;
    if (!warned) {
      warned = true;
      console.warn('[ScanR] Native typing was blocked here. Fallback typing is now active.');
    }
  }
  function copyText(t) {
    try { navigator.clipboard.writeText(t).catch(function () {}); } catch (_) {}
  }
  function readClip(cb) {
    try {
      navigator.clipboard.readText().then(function (x) { if (x) cb(x); }).catch(function () {
        if (typeof toast === 'function') toast('Allow clipboard access, or use right-click Paste');
      });
    } catch (_) {}
  }
  function afterPaste(el) {
    try {
      if (typeof isH === 'function' && typeof route === 'function' && isH(el.value.trim())) route(el.value);
    } catch (_) {}
  }
  // Run act() only if the browser did NOT change the field after this key
  function verify(el, act) {
    var before = el.value, r = sel(el), got = false;
    var mark = function () { got = true; };
    el.addEventListener('input', mark, { once: true });
    setTimeout(function () {
      el.removeEventListener('input', mark);
      if (got || el.value !== before) return;
      if (document.activeElement !== el) return;
      flag();
      try { el.setSelectionRange(r[0], r[1]); } catch (_) {}
      act();
    }, 40);
  }

  window.addEventListener('keydown', function (e) {
    var k = e.key || '', low = k.toLowerCase();
    var mod = e.ctrlKey || e.metaKey;

    // Copy from normal page text (results etc.)
    if (mod && !e.altKey && low === 'c' && !field(e.target)) {
      var gs = String(window.getSelection ? window.getSelection() : '');
      if (gs) copyText(gs);
      return;
    }

    var el = field(e.target);
    if (!el || el.disabled || el.readOnly || e.isComposing) return;

    if (mod && !e.altKey) {
      var r = sel(el), txt = el.value.slice(r[0], r[1]);
      if (low === 'a') { e.preventDefault(); try { el.select(); } catch (_) {} return; }
      if (low === 'c') { if (txt) copyText(txt); return; }
      if (low === 'x') {
        if (txt) { copyText(txt); verify(el, function () { del(el, true); }); }
        return;
      }
      if (low === 'v') {
        pasteSeen = false;
        var b = el.value;
        setTimeout(function () {
          if (pasteSeen || el.value !== b) return;
          flag();
          readClip(function (x) { put(el, x); afterPaste(el); });
        }, 120);
      }
      return;
    }
    if (mod || e.altKey) return;

    if (k.length === 1) {
      var r2 = sel(el), mx = el.maxLength > 0 ? el.maxLength : 0;
      if (mx && r2[0] === r2[1] && el.value.length >= mx) return;
      if (broken) { e.preventDefault(); put(el, k); return; }
      verify(el, function () { put(el, k); });
      return;
    }
    if (k === 'Backspace' || k === 'Delete') {
      var r3 = sel(el), back = (k === 'Backspace');
      if (r3[0] === r3[1] && (back ? r3[0] === 0 : r3[0] >= el.value.length)) return;
      if (broken) { e.preventDefault(); del(el, back); return; }
      verify(el, function () { del(el, back); });
    }
  }, true);

  window.addEventListener('paste', function (e) {
    var el = field(e.target);
    if (!el || el.disabled || el.readOnly) return;
    pasteSeen = true;
    var t = e.clipboardData && e.clipboardData.getData('text/plain');
    if (t) {
      verify(el, function () { put(el, t); afterPaste(el); });
    } else {
      verify(el, function () { readClip(function (x) { put(el, x); afterPaste(el); }); });
    }
  }, true);

  console.log('ScanR typing fallback ready.');
})();
</script>
